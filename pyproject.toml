[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpy2psp"
version = "0.1.0"
description = "Convert Ren'Py visual novels into native PSP homebrew"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Exact pins; requirements.txt is the matching lock used by CI and the release job.
dependencies = [
    "pillow==13.0.0",
]

[project.scripts]
rpy2psp = "rpy2psp.cli:main"

[tool.setuptools.packages.find]
include = ["rpy2psp*"]
