name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build clang ffmpeg libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          python -m pip install -r requirements.txt

      - name: Configure and build the engine
        run: |
          cmake -S . -B out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build out/linux

      - name: Engine tests (unit, engine vs reference, headless platform smoke)
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --test-dir out/linux --output-on-failure

      - name: Converter tests
        env:
          VNPSP_EXE: ${{ github.workspace }}/out/linux/vnpsp/vnpsp
        run: python -m unittest discover -s tests -t .

  psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:v20261001@sha256:54895e6f5afb71b8f4f6915ee6d5023e1e087ca7afdf2dcb1d7a694a5233e45f
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT.PBP
        run: bash scripts/psp-build.sh Release
