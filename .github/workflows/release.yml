name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Package (PyInstaller, one folder)
        run: >
          python -m PyInstaller --noconfirm --onedir --name rpy2psp
          --workpath "$env:RUNNER_TEMP/pyi-work" --distpath "$env:RUNNER_TEMP/pyi-out"
          --collect-all soundfile --collect-all etcpak --collect-data archspec
          --collect-binaries lameenc --collect-binaries soxr
          packaging/rpy2psp_entry.py

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP/pyi-out/rpy2psp/rpy2psp.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/smoke/game" | Out-Null
          Copy-Item tests/compiler/cases/control_flow.rpy "$env:RUNNER_TEMP/smoke/game/script.rpy"
          & $exe compile "$env:RUNNER_TEMP/smoke" -o "$env:RUNNER_TEMP/smoke-out"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe disasm "$env:RUNNER_TEMP/smoke-out/script.vnb" | Select-Object -First 5

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md "$env:RUNNER_TEMP/pyi-out/rpy2psp/"
          Compress-Archive -Path "$env:RUNNER_TEMP/pyi-out/rpy2psp" -DestinationPath "rpy2psp-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rpy2psp-${{ github.ref_name }}-windows-x64.zip

  psp:
    # The vnpsp engine as a PSP EBOOT, built in the same pinned image as scripts/psp-build.sh.
    runs-on: ubuntu-latest
    container: pspdev/pspdev:v20261001@sha256:54895e6f5afb71b8f4f6915ee6d5023e1e087ca7afdf2dcb1d7a694a5233e45f
    steps:
      - uses: actions/checkout@v4

      - name: Build EBOOT.PBP
        run: bash scripts/psp-build.sh Release

      - name: Zip
        run: |
          mkdir -p vnpsp
          cp out/psp/vnpsp/EBOOT.PBP LICENSE README.md vnpsp/
          cmake -E tar cf "vnpsp-${{ github.ref_name }}-psp.zip" --format=zip vnpsp

      - uses: actions/upload-artifact@v4
        with:
          name: psp
          path: vnpsp-${{ github.ref_name }}-psp.zip

  publish:
    needs: [windows, psp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}"
          "rpy2psp-${{ github.ref_name }}-windows-x64.zip" "vnpsp-${{ github.ref_name }}-psp.zip"
          --title "${{ github.ref_name }}" --generate-notes
